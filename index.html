<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Imprimibles Escolares</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; text-align: center; }
    h1 { color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
    p.subtitle { color: #7f8c8d; font-size: 14px; margin-top: 0; }
    
    .controls { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; }
    .form-group { margin-bottom: 10px; }
    label { font-weight: bold; font-size: 12px; color: #34495e; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    button { background: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2980b9; }
    button.btn-secondary { background: #2ecc71; }
    
    /* Maqueta del Tríptico */
    .triptico-container { background: white; border: 2px dashed #bdc3c7; border-radius: 8px; padding: 10px; width: 100%; max-width: 800px; margin: 0 auto; box-shadow: 0 8px 15px rgba(0,0,0,0.1); overflow-x: auto; }
    .hoja-carta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #fff; border: 1px solid #e0e0e0; min-height: 280px; padding: 10px; box-sizing: border-box; text-align: left; }
    
    .panel { border: 1px dashed #3498db; border-radius: 6px; padding: 8px; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; }
    .panel-header { font-weight: bold; color: #2980b9; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 6px; text-align: center; text-transform: uppercase; }
    .panel-content { flex-grow: 1; }
    .panel-img { width: 100%; height: 70px; object-fit: cover; border-radius: 4px; margin-top: 5px; background: #eee; }
  </style>
</head>
<body>

  <h1>📄 Creador de Trípticos Escolares</h1>
  <p class="subtitle">Maquetación en Vivo · Listo para Imprimir</p>

  <div class="controls">
    <div class="form-group">
      <label>Tema del Tríptico:</label>
      <input type="text" id="inTema" value="Los Gatos Saludables" oninput="actualizarVista()">
    </div>
    <div class="form-group">
      <label>Nombre del Alumno:</label>
      <input type="text" id="inAlumno" value="Bichurrita Nieto Fuentes" oninput="actualizarVista()">
    </div>
    <div class="form-group">
      <label>Estilo de Ilustración:</label>
      <select id="inEstilo">
        <option>🎨 Cartoon / Educativo</option>
        <option>🌸 Kawaii / Bonito</option>
        <option>📸 Fotográfico / Realista</option>
        <option>✏️ Dibujo Coloreable</option>
      </select>
    </div>
  </div>

  <div class="btn-group">
    <button onclick="toggleVista()" id="btnVista">🔄 Ver Cara Interior (Frente)</button>
    <button class="btn-secondary" onclick="window.print()">📄 Imprimir / Guardar PDF</button>
  </div>

  <!-- Vista Previa de la Hoja -->
  <div class="triptico-container">
    <div class="hoja-carta" id="hojaTriptico">
      <!-- Los paneles se cargan dinámicamente -->
    </div>
  </div>

  <script>
    let vistaExterior = true;

    function actualizarVista() {
      const tema = document.getElementById('inTema').value || 'Tema Escolar';
      const alumno = document.getElementById('inAlumno').value || 'Nombre Alumno';
      const hoja = document.getElementById('hojaTriptico');

      if (vistaExterior) {
        hoja.innerHTML = `
          <div class="panel">
            <div class="panel-header">Solapa (Cara 5)</div>
            <div class="panel-content">
              <strong>Cuidados y Curiosidades:</strong><br>
              Mantener a tu mascota vacunada y alimentada adecuadamente garantiza una vida feliz.
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">Contraportada (Cara 6)</div>
            <div class="panel-content">
              <strong>Datos Escolares:</strong><br>
              <strong>Alumno:</strong> ${alumno}<br>
              <strong>Grado:</strong> 5º Grado<br>
              <strong>Escuela:</strong> U.E. Mishistica
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">Portada (Cara 1)</div>
            <div class="panel-content" style="text-align: center;">
              <h3 style="margin: 5px 0; color: #2c3e50;">${tema}</h3>
              <p style="font-size: 10px; color: #7f8c8d;">Guía Informativa Escolar</p>
              <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300" class="panel-img" alt="Portada">
            </div>
          </div>
        `;
      } else {
        hoja.innerHTML = `
          <div class="panel">
            <div class="panel-header">Cara Interior 1 (Cara 2)</div>
            <div class="panel-content">
              <strong>¿Qué son los Gatos?</strong><br>
              Los gatos son mamíferos carnívoros de la familia Felidae. Poseen una gran agilidad y sentidos muy desarrollados.
            </div>
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=300" class="panel-img" alt="Interior 1">
          </div>
          <div class="panel">
            <div class="panel-header">Cara Interior 2 (Cara 3)</div>
            <div class="panel-content">
              <strong>Alimentación Saludable:</strong><br>
              Requieren una dieta rica en proteínas y agua fresca siempre disponible para evitar enfermedades renales.
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">Cara Interior 3 (Cara 4)</div>
            <div class="panel-content">
              <strong>Importancia de las Vacunas:</strong><br>
              Las consultas periódicas al veterinario aseguran que cumpla su esquema de vacunación completo.
            </div>
          </div>
        `;
      }
    }

    function toggleVista() {
      vistaExterior = !vistaExterior;
      document.getElementById('btnVista').innerText = vistaExterior ? "🔄 Ver Cara Interior (Frente)" : "🔄 Ver Cara Exterior (Dorso)";
      actualizarVista();
    }

    // Inicializar
    actualizarVista();
  </script>

</body>
</html>
