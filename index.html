<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Pun Pan - Generador Educativo Profesional</title>
  
  <!-- Fuentes Escolares y Kawaii de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
  
  <!-- Librería para Exportar a Imagen PNG HD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary: #ff6b81;
      --secondary: #70a1ff;
      --bg: #f7f1e3;
      --card-bg: #ffffff;
      --font-title: 'Bubblegum Sans', cursive;
      --font-body: 'Fredoka', 'Quicksand', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      margin: 0;
      padding: 12px;
      color: #2f3542;
    }

    h1 {
      text-align: center;
      color: #ff4757;
      font-size: 26px;
      margin-bottom: 2px;
      font-family: var(--font-title);
      text-shadow: 2px 2px 0px #ffeaa7;
    }
    p.subtitle { text-align: center; color: #57606f; font-size: 13px; margin-top: 0; margin-bottom: 15px; }

    .app-container { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 920px) { .app-container { grid-template-columns: 400px 1fr; } }

    .control-panel {
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-height: 85vh;
      overflow-y: auto;
      border: 3px solid #f1f2f6;
    }

    .section-title { font-size: 12px; font-weight: bold; color: #70a1ff; border-bottom: 2px dashed #dfe4ea; padding-bottom: 4px; margin-top: 15px; margin-bottom: 10px; text-transform: uppercase; }
    
    .ai-section {
      background: #fff0f6;
      border: 2px dashed #ff80ab;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 15px;
    }
    .ai-title { color: #c2185b; font-size: 14px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; font-family: var(--font-title); }

    .form-group { margin-bottom: 10px; }
    label { font-weight: 700; font-size: 11px; color: #57606f; display: block; margin-bottom: 3px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #ced6e0;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 12px;
      font-family: var(--font-body);
    }
    textarea { resize: vertical; height: 50px; }

    .btn-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    button {
      background: #70a1ff;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      font-family: var(--font-body);
    }
    button:hover { transform: translateY(-2px); opacity: 0.95; }
    button.btn-green { background: #2ed573; }
    button.btn-orange { background: #ffa502; }
    button.btn-ai { background: #ff4757; width: 100%; margin-top: 5px; }

    /* Área de Previsualización Fluida y Sin Cortes */
    .preview-area { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow-x: auto; }
    
    .hoja-impresion {
      background: #ffffff;
      border: 3px solid #dfe4ea;
      border-radius: 16px;
      box-sizing: border-box;
      position: relative;
      margin: 0 auto;
      padding: 15px;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Tamaños de Papel */
    .papel-carta { width: 780px; }
    .papel-oficio { width: 890px; }
    .papel-tabloide { width: 1020px; }

    /* Estilos de Lámina Expositiva */
    .lamina-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      height: 100%;
      flex-grow: 1;
    }
    
    .lamina-header {
      grid-column: 1 / -1;
      background: #ff6b81;
      color: white;
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 12px rgba(255, 107, 129, 0.3);
      border: 3px solid #ffeaa7;
    }
    .lamina-header h2 { margin: 0; font-size: 26px; font-family: var(--font-title); letter-spacing: 1px; }

    .sticker-card {
      background: #fff;
      border: 2px solid #70a1ff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 4px 4px 0px #70a1ff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .sticker-card-title {
      font-size: 12px;
      font-weight: bold;
      color: #3742fa;
      background: #eccc68;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      text-align: center;
    }
    .sticker-card-text { font-size: 12px; color: #2f3542; line-height: 1.4; flex-grow: 1; }

    .panel-img-container {
      width: 100%;
      height: 120px;
      background: #f1f2f6;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #ced6e0;
    }
    .panel-img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

    /* Malla para Trípticos */
    .grid-triptico { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; height: 100%; flex-grow: 1; }
    .columna-panel {
      border-right: 2px dashed #ced6e0;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .columna-panel:last-child { border-right: none; }

    @media print {
      body { background: white; padding: 0; }
      .control-panel, .btn-group, h1, p.subtitle { display: none !important; }
      .preview-area { box-shadow: none; padding: 0; }
      .hoja-impresion { border: none; width: 100vw; height: 100vh; }
      @page { size: landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <h1>✨ Pin Pun Pan - Creador Educativo</h1>
  <p class="subtitle">Láminas Expositivas · Trípticos · Infografías Profesionales</p>

  <div class="btn-group">
    <button onclick="toggleVista()" id="btnVista">🔄 Ver Cara Interior / Contenido</button>
    <button class="btn-orange" onclick="exportarPNG()">🖼️ Descargar Imagen (PNG HD)</button>
    <button class="btn-green" onclick="window.print()">🖨️ Guardar PDF / Imprimir</button>
  </div>

  <div class="app-container">
    
    <!-- PANEL DE CONTROL -->
    <div class="control-panel">
      
      <!-- MÓDULO IA Y ESTILOS -->
      <div class="ai-section">
        <div class="ai-title">🎨 Generador Inteligente Pin Pun Pan</div>
        
        <div class="form-group">
          <label>Tema del Material:</label>
          <input type="text" id="inTemaIA" value="El Reciclaje Escolar">
        </div>

        <div class="form-group">
          <label>Estilo Visual de Ilustraciones:</label>
          <select id="inEstiloImg" onchange="aplicarEstiloVisual()">
            <option value="reciclaje" selected>♻️ Estilo Ecología / Reciclaje Animado</option>
            <option value="electricidad">⚡ Estilo Ciencia / Electricidad Kawaii</option>
            <option value="animales">🐾 Estilo Animales y Naturaleza TIERNA</option>
            <option value="espacio">🚀 Estilo Universo y Espacio Escolar</option>
          </select>
        </div>

        <button class="btn-ai" onclick="generarContenidoInteligente()">✨ Generar Texto e Imágenes con IA</button>
      </div>

      <div class="section-title">1. Formato y Tamaño de Papel</div>
      <div class="form-group">
        <label>Tipo de Recurso Educativo:</label>
        <select id="inFormato" onchange="actualizarVista()">
          <option value="lamina" selected>🖼️ Lámina Expositiva / Infografía (Página Entera)</option>
          <option value="triptico">📑 Tríptico Escolar (6 Caras)</option>
          <option value="diptico">📖 Díptico Escolar (4 Caras)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tamaño de Papel:</label>
        <select id="inPapel" onchange="actualizarVista()">
          <option value="papel-carta">📄 Carta (21.6 x 27.9 cm)</option>
          <option value="papel-oficio">📜 Oficio (21.6 x 35.6 cm)</option>
          <option value="papel-tabloide" selected>🖼️ Tabloide / Doble Carta (28 x 43 cm)</option>
        </select>
      </div>

      <div class="section-title">2. Identificación del Alumno</div>
      <div class="form-group"><label>Alumno(a):</label><input type="text" id="inAlumno" value="Bichurrita Nieto Fuentes" oninput="actualizarVista()"></div>
      <div class="form-group"><label>Escuela / U.E.:</label><input type="text" id="inEscuela" value="U.E. Mishistica" oninput="actualizarVista()"></div>
      <div class="form-group"><label>Grado y Sección:</label><input type="text" id="inGrado" value="5º Grado 'A'" oninput="actualizarVista()"></div>

      <div class="section-title">3. Edición de Textos e Imágenes</div>
      <div class="form-group"><label>Título Principal:</label><input type="text" id="inTitulo" value="EL RECICLAJE Y SU IMPORTANCIA" oninput="actualizarVista()"></div>
      
      <div class="form-group"><label>Sección 1 (Texto):</label><textarea id="txtCara1" oninput="actualizarVista()">¿Qué es el reciclaje? Es el proceso de recolectar y transformar desechos en nuevos materiales para cuidar el planeta.</textarea></div>
      <div class="form-group"><label>Imagen 1 (URL / PNG):</label><input type="text" id="imgCara1" value="https://cdn-icons-png.flaticon.com/512/3069/3069176.png" oninput="actualizarVista()"></div>

      <div class="form-group"><label>Sección 2 (Texto):</label><textarea id="txtCara2" oninput="actualizarVista()">Clasificación: Separar adecuadamente los residuos en papel, plástico, vidrio y metal en los contenedores.</textarea></div>
      <div class="form-group"><label>Imagen 2 (URL / PNG):</label><input type="text" id="imgCara2" value="https://cdn-icons-png.flaticon.com/512/1598/1598208.png" oninput="actualizarVista()"></div>

      <div class="form-group"><label>Sección 3 (Texto):</label><textarea id="txtCara3" oninput="actualizarVista()">Beneficios: Reducir la contaminación, conservar los recursos naturales y asegurar un futuro limpio.</textarea></div>
      <div class="form-group"><label>Imagen 3 (URL / PNG):</label><input type="text" id="imgCara3" value="https://cdn-icons-png.flaticon.com/512/2921/2921822.png" oninput="actualizarVista()"></div>

    </div>

    <!-- VISTA PREVIA INTERACTIVA -->
    <div class="preview-area">
      <div class="hoja-impresion papel-tabloide" id="hojaLienzo">
        <!-- Generación Dinámica -->
      </div>
    </div>

  </div>

  <script>
    let vistaExterior = true;

    function renderImg(url) {
      if(!url) return '';
      return `<div class="panel-img-container"><img src="${url}" class="panel-img" alt="Ilustración" onerror="this.parentNode.style.display='none'"></div>`;
    }

    function aplicarEstiloVisual() {
      const estilo = document.getElementById('inEstiloImg').value;
      
      if (estilo === 'reciclaje') {
        document.getElementById('imgCara1').value = 'https://cdn-icons-png.flaticon.com/512/3069/3069176.png';
        document.getElementById('imgCara2').value = 'https://cdn-icons-png.flaticon.com/512/1598/1598208.png';
        document.getElementById('imgCara3').value = 'https://cdn-icons-png.flaticon.com/512/2921/2921822.png';
      } else if (estilo === 'electricidad') {
        document.getElementById('imgCara1').value = 'https://cdn-icons-png.flaticon.com/512/3109/3109813.png';
        document.getElementById('imgCara2').value = 'https://cdn-icons-png.flaticon.com/512/2983/2983780.png';
        document.getElementById('imgCara3').value = 'https://cdn-icons-png.flaticon.com/512/1040/1040230.png';
      } else if (estilo === 'animales') {
        document.getElementById('imgCara1').value = 'https://cdn-icons-png.flaticon.com/512/616/616408.png';
        document.getElementById('imgCara2').value = 'https://cdn-icons-png.flaticon.com/512/616/616430.png';
        document.getElementById('imgCara3').value = 'https://cdn-icons-png.flaticon.com/512/616/616554.png';
      } else if (estilo === 'espacio') {
        document.getElementById('imgCara1').value = 'https://cdn-icons-png.flaticon.com/512/3128/3128310.png';
        document.getElementById('imgCara2').value = 'https://cdn-icons-png.flaticon.com/512/3062/3062634.png';
        document.getElementById('imgCara3').value = 'https://cdn-icons-png.flaticon.com/512/2917/2917995.png';
      }
      actualizarVista();
    }

    function generarContenidoInteligente() {
      const tema = document.getElementById('inTemaIA').value || 'Tema Escolar';
      document.getElementById('inTitulo').value = tema.toUpperCase();
      document.getElementById('txtCara1').value = `Introducción y Concepto: Explicación clave y fundamental sobre ${tema} adaptada para el nivel escolar.`;
      document.getElementById('txtCara2').value = `Desarrollo y Práctica: Fases, características y cómo se aplica ${tema} en la vida diaria.`;
      document.getElementById('txtCara3').value = `Conclusión y Recomendaciones: Puntos esenciales a recordar y reflexiones finales sobre ${tema}.`;
      aplicarEstiloVisual();
      alert(`✨ ¡Contenido generado con éxito para: "${tema}"!`);
    }

    function actualizarVista() {
      const formato = document.getElementById('inFormato').value;
      const papel = document.getElementById('inPapel').value;

      const titulo = document.getElementById('inTitulo').value || 'TÍTULO PRINCIPAL';
      const alumno = document.getElementById('inAlumno').value || 'Alumno';
      const escuela = document.getElementById('inEscuela').value || 'Escuela';
      const grado = document.getElementById('inGrado').value || 'Grado';

      const txt1 = document.getElementById('txtCara1').value;
      const txt2 = document.getElementById('txtCara2').value;
      const txt3 = document.getElementById('txtCara3').value;

      const img1 = document.getElementById('imgCara1').value;
      const img2 = document.getElementById('imgCara2').value;
      const img3 = document.getElementById('imgCara3').value;

      const lienzo = document.getElementById('hojaLienzo');
      lienzo.className = `hoja-impresion ${papel}`;

      if (formato === 'lamina') {
        lienzo.innerHTML = `
          <div class="lamina-container">
            <div class="lamina-header">
              <h2>🌟 ${titulo} 🌟</h2>
            </div>
            
            <div class="sticker-card">
              <span class="sticker-card-title">1. CONCEPTO PRINCIPAL</span>
              <p class="sticker-card-text">${txt1}</p>
              ${renderImg(img1)}
            </div>

            <div class="sticker-card">
              <span class="sticker-card-title">2. DESARROLLO Y PRÁCTICA</span>
              <p class="sticker-card-text">${txt2}</p>
              ${renderImg(img2)}
            </div>

            <div class="sticker-card" style="grid-column: 1 / -1;">
              <span class="sticker-card-title">💡 CONCLUSIÓN Y RECOMENDACIONES</span>
              <p class="sticker-card-text">${txt3}</p>
              ${renderImg(img3)}
            </div>

            <div style="grid-column: 1 / -1; text-align: center; font-size: 10px; color: #747d8c; border-top: 1px dashed #ced6e0; padding-top: 4px;">
              <strong>Alumno:</strong> ${alumno} | <strong>Escuela:</strong> ${escuela} | <strong>Grado:</strong> ${grado}
            </div>
          </div>
        `;
      } else {
        lienzo.innerHTML = `
          <div class="grid-triptico" style="height: 100%;">
            <div class="columna-panel">
              <div class="sticker-card">
                <span class="sticker-card-title">SECCIÓN 1</span>
                <p class="sticker-card-text">${txt1}</p>
                ${renderImg(img1)}
              </div>
            </div>
            <div class="columna-panel">
              <div class="sticker-card">
                <span class="sticker-card-title">SECCIÓN 2</span>
                <p class="sticker-card-text">${txt2}</p>
                ${renderImg(img2)}
              </div>
            </div>
            <div class="columna-panel">
              <div class="sticker-card">
                <span class="sticker-card-title">PORTADA</span>
                <h3 style="text-align:center; color:#ff4757; margin:5px 0; font-family:var(--font-title);">${titulo}</h3>
                ${renderImg(img3)}
                <p style="font-size:9px; text-align:center; margin-top:10px;"><strong>${alumno}</strong><br>${escuela} - ${grado}</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    function toggleVista() {
      vistaExterior = !vistaExterior;
      document.getElementById('btnVista').innerText = vistaExterior ? "🔄 Ver Cara Interior" : "🔄 Ver Cara Exterior";
      actualizarVista();
    }

    function exportarPNG() {
      const lienzo = document.getElementById('hojaLienzo');
      html2canvas(lienzo, { scale: 2 }).then(canvas => {
        const enlace = document.createElement('a');
        enlace.download = 'recurso-educativo-pinpunpan.png';
        enlace.href = canvas.toDataURL('image/png');
        enlace.click();
      });
    }

    actualizarVista();
  </script>

</body>
</html>
