<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Pun Pan - Generador de Recursos Educativos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary: #ff4757;
      --secondary: #54a0ff;
      --bg: #f7f1e3;
      --font-title: 'Bubblegum Sans', cursive;
      --font-body: 'Fredoka', sans-serif;
    }

    body { font-family: var(--font-body); background: var(--bg); margin: 0; padding: 10px; color: #2f3542; }
    h1 { text-align: center; color: var(--primary); font-size: 26px; font-family: var(--font-title); margin: 5px 0; }
    p.subtitle { text-align: center; color: #57606f; font-size: 12px; margin-bottom: 12px; }

    .app-container { max-width: 1250px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 900px) { .app-container { grid-template-columns: 380px 1fr; } }

    .control-panel { background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-height: 85vh; overflow-y: auto; border: 2px solid #eccc68; }
    .section-title { font-size: 11px; font-weight: bold; color: var(--secondary); border-bottom: 2px dashed #dfe4ea; padding-bottom: 3px; margin: 12px 0 8px 0; text-transform: uppercase; }

    .form-group { margin-bottom: 8px; }
    label { font-weight: 700; font-size: 11px; color: #57606f; display: block; margin-bottom: 2px; }
    input, select, textarea { width: 100%; padding: 7px; border: 2px solid #ced6e0; border-radius: 8px; box-sizing: border-box; font-size: 11px; font-family: var(--font-body); }
    textarea { height: 40px; }

    .btn-group { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    button { background: var(--secondary); color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
    button.btn-green { background: #2ed573; }
    button.btn-orange { background: #ffa502; }

    .preview-area { background: white; padding: 15px; border-radius: 16px; overflow-x: auto; }
    .hoja-impresion { background: white; border: 3px solid #dfe4ea; border-radius: 12px; box-sizing: border-box; margin: 0 auto; padding: 12px; min-height: 550px; display: flex; flex-direction: column; justify-content: space-between; }

    .papel-carta { width: 780px; }
    .papel-oficio { width: 880px; }
    .papel-tabloide { width: 1000px; }

    /* Estilos Mapa Conceptual (Nubes y Flechas) */
    .mapa-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .nube-principal { background: #ff7675; color: white; border-radius: 30px; padding: 12px 25px; font-family: var(--font-title); font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .flecha-down { font-size: 20px; color: #74b9ff; font-weight: bold; }
    .nodos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .nodo-card { background: #eccc68; border-radius: 16px; padding: 10px; border: 2px solid #ffa502; box-shadow: 3px 3px 0px #ffa502; }

    /* Estilos Lapbook */
    .lapbook-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; height: 100%; }
    .bolsillo { border: 2px dashed #ff6b81; background: #fff0f6; border-radius: 12px; padding: 8px; text-align: center; }

    /* Estilos Tríptico */
    .grid-triptico { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; height: 100%; }
    .col-triptico { border-right: 2px dashed #ced6e0; padding: 6px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
    .col-triptico:last-child { border-right: none; }

    .img-box { width: 100%; height: 90px; background: #f1f2f6; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px dashed #ced6e0; }
    .img-box img { width: 100%; height: 100%; object-fit: contain; }

    @media print {
      .control-panel, .btn-group, h1, p.subtitle { display: none !important; }
      .preview-area { padding: 0; box-shadow: none; }
      .hoja-impresion { border: none; width: 100vw; height: 100vh; }
      @page { size: landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <h1>✨ Pin Pun Pan - Suite Educativa Multiformato</h1>
  <p class="subtitle">Trípticos (6 Caras) · Lapbooks · Mapas Conceptuales con Nubes · Láminas</p>

  <div class="btn-group">
    <button onclick="toggleVistaTriptico()" id="btnVista">🔄 Ver Caras 4, 5 y 6 (Dorso)</button>
    <button class="btn-orange" onclick="exportarPNG()">🖼️ Descargar PNG HD</button>
    <button class="btn-green" onclick="window.print()">🖨️ Guardar PDF / Imprimir</button>
  </div>

  <div class="app-container">
    
    <div class="control-panel">
      
      <div class="section-title">1. Formato y Hoja</div>
      <div class="form-group">
        <label>Instrumento Educativo:</label>
        <select id="inFormato" onchange="guardarYActualizar()">
          <option value="triptico">📑 Tríptico Escolar (6 Caras Fijas)</option>
          <option value="mapa">☁️ Mapa Conceptual (Nubes y Flechas)</option>
          <option value="lapbook">✂️ Patrón para Lapbook (Bolsillos y Solapas)</option>
          <option value="lamina">🖼️ Lámina Expositiva (Página Entera)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tamaño de Papel:</label>
        <select id="inPapel" onchange="guardarYActualizar()">
          <option value="papel-carta">📄 Carta (21.6 x 27.9 cm)</option>
          <option value="papel-oficio">📜 Oficio (21.6 x 35.6 cm)</option>
          <option value="papel-tabloide">🖼️ Tabloide (28 x 43 cm)</option>
        </select>
      </div>

      <div class="section-title">2. Identificación</div>
      <div class="form-group"><label>Alumno:</label><input type="text" id="inAlumno" value="Bichurrita Nieto Fuentes" oninput="guardarYActualizar()"></div>
      <div class="form-group"><label>Escuela y Grado:</label><input type="text" id="inEscuela" value="U.E. Mishistica - 5º Grado" oninput="guardarYActualizar()"></div>

      <div class="section-title">3. Contenido (Título e Imágenes)</div>
      <div class="form-group"><label>Título Principal:</label><input type="text" id="inTitulo" value="EL RECICLAJE ESCOLAR" oninput="guardarYActualizar()"></div>
      
      <div class="form-group">
        <label>Texto Sección 1 / Cara 1:</label>
        <textarea id="txt1" oninput="guardarYActualizar()">El reciclaje transforma desechos en nuevos productos útiles para cuidar la Tierra.</textarea>
      </div>
      <div class="form-group">
        <label>Imagen Sección 1 (Subir de Galería o URL):</label>
        <input type="file" accept="image/*" onchange="cargarImagenLocal(event, 'img1')">
        <input type="text" id="img1" placeholder="O pega enlace de imagen" oninput="guardarYActualizar()">
      </div>

      <div class="form-group">
        <label>Texto Sección 2 / Cara 2:</label>
        <textarea id="txt2" oninput="guardarYActualizar()">Clasificación: Separar plástico, vidrio, papel y metal en sus contenedores.</textarea>
      </div>
      <div class="form-group">
        <label>Imagen Sección 2:</label>
        <input type="file" accept="image/*" onchange="cargarImagenLocal(event, 'img2')">
        <input type="text" id="img2" oninput="guardarYActualizar()">
      </div>

      <div class="form-group">
        <label>Texto Sección 3 / Cara 3:</label>
        <textarea id="txt3" oninput="guardarYActualizar()">Beneficios: Disminuye la contaminación y preserva la energía del planeta.</textarea>
      </div>
      <div class="form-group">
        <label>Imagen Sección 3:</label>
        <input type="file" accept="image/*" onchange="cargarImagenLocal(event, 'img3')">
        <input type="text" id="img3" oninput="guardarYActualizar()">
      </div>

    </div>

    <div class="preview-area">
      <div class="hoja-impresion papel-carta" id="hojaLienzo"></div>
    </div>

  </div>

  <script>
    let vistaFrente = true;

    function cargarImagenLocal(event, targetId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetId).value = e.target.result;
          guardarYActualizar();
        };
        reader.readAsDataURL(file);
      }
    }

    function guardarYActualizar() {
      // Guardar datos localmente para que no se borren al refrescar la pantalla
      const datos = {
        formato: document.getElementById('inFormato').value,
        papel: document.getElementById('inPapel').value,
        alumno: document.getElementById('inAlumno').value,
        escuela: document.getElementById('inEscuela').value,
        titulo: document.getElementById('inTitulo').value,
        txt1: document.getElementById('txt1').value,
        txt2: document.getElementById('txt2').value,
        txt3: document.getElementById('txt3').value,
        img1: document.getElementById('img1').value,
        img2: document.getElementById('img2').value,
        img3: document.getElementById('img3').value,
      };
      localStorage.setItem('pinpunpan_data', JSON.stringify(datos));
      render();
    }

    function cargarMemoria() {
      const saved = localStorage.getItem('pinpunpan_data');
      if (saved) {
        const d = JSON.parse(saved);
        document.getElementById('inFormato').value = d.formato || 'triptico';
        document.getElementById('inPapel').value = d.papel || 'papel-carta';
        document.getElementById('inAlumno').value = d.alumno || '';
        document.getElementById('inEscuela').value = d.escuela || '';
        document.getElementById('inTitulo').value = d.titulo || '';
        document.getElementById('txt1').value = d.txt1 || '';
        document.getElementById('txt2').value = d.txt2 || '';
        document.getElementById('txt3').value = d.txt3 || '';
        document.getElementById('img1').value = d.img1 || '';
        document.getElementById('img2').value = d.img2 || '';
        document.getElementById('img3').value = d.img3 || '';
      }
      render();
    }

    function renderImg(url) {
      if(!url) return '<div class="img-box"><small style="color:#a0aec0;">Sin Imagen</small></div>';
      return `<div class="img-box"><img src="${url}" alt="Ilustración"></div>`;
    }

    function toggleVistaTriptico() {
      vistaFrente = !vistaFrente;
      document.getElementById('btnVista').innerText = vistaFrente ? "🔄 Ver Caras 4, 5 y 6 (Dorso)" : "🔄 Ver Caras 1, 2 y 3 (Frente)";
      render();
    }

    function render() {
      const formato = document.getElementById('inFormato').value;
      const papel = document.getElementById('inPapel').value;

      const titulo = document.getElementById('inTitulo').value || 'TÍTULO';
      const alumno = document.getElementById('inAlumno').value || 'Alumno';
      const escuela = document.getElementById('inEscuela').value || 'Escuela';

      const txt1 = document.getElementById('txt1').value;
      const txt2 = document.getElementById('txt2').value;
      const txt3 = document.getElementById('txt3').value;

      const img1 = document.getElementById('img1').value;
      const img2 = document.getElementById('img2').value;
      const img3 = document.getElementById('img3').value;

      const lienzo = document.getElementById('hojaLienzo');
      lienzo.className = `hoja-impresion ${papel}`;

      if (formato === 'mapa') {
        // MAPA CONCEPTUAL CON NUBES Y FLECHAS
        lienzo.innerHTML = `
          <div class="mapa-container">
            <div class="nube-principal">☁️ ${titulo} ☁️</div>
            <div class="flecha-down">⬇️</div>
            <div class="nodos-grid">
              <div class="nodo-card">
                <strong style="color:#d63031;">1. Concepto Clave</strong>
                <p style="font-size:11px;">${txt1}</p>
                ${renderImg(img1)}
              </div>
              <div class="nodo-card" style="background:#74b9ff; border-color:#0984e3; box-shadow:3px 3px 0px #0984e3; color:white;">
                <strong>2. Clasificación</strong>
                <p style="font-size:11px;">${txt2}</p>
                ${renderImg(img2)}
              </div>
            </div>
            <div class="flecha-down">⬇️</div>
            <div class="nodo-card" style="width:100%; background:#55efc4; border-color:#00b894; box-shadow:3px 3px 0px #00b894;">
              <strong>3. Impacto y Recomendaciones</strong>
              <p style="font-size:11px;">${txt3}</p>
              ${renderImg(img3)}
            </div>
            <div style="font-size:10px; color:#b2bec3; margin-top:5px;">${alumno} | ${escuela}</div>
          </div>
        `;
      } else if (formato === 'lapbook') {
        // PATRÓN PARA LAPBOOK
        lienzo.innerHTML = `
          <div class="lapbook-grid">
            <div class="bolsillo">
              <strong>✂️ Solapa Desplegable A</strong>
              <p style="font-size:10px;">${txt1}</p>
              ${renderImg(img1)}
            </div>
            <div class="bolsillo" style="background:#e3f2fd; border-color:#2196f3;">
              <strong>✉️ Bolsillo Central</strong>
              <h3 style="margin:5px 0;">${titulo}</h3>
              ${renderImg(img2)}
              <small>${alumno}</small>
            </div>
            <div class="bolsillo">
              <strong>✂️ Solapa Desplegable B</strong>
              <p style="font-size:10px;">${txt3}</p>
              ${renderImg(img3)}
            </div>
          </div>
        `;
      } else if (formato === 'triptico') {
        // TRÍPTICO DE 6 CARAS
        if (vistaFrente) {
          lienzo.innerHTML = `
            <div class="grid-triptico">
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">CARA 1 (Interior Left)</small>
                <p style="font-size:11px;">${txt1}</p>
                ${renderImg(img1)}
              </div>
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">CARA 2 (Centro)</small>
                <p style="font-size:11px;">${txt2}</p>
                ${renderImg(img2)}
              </div>
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">CARA 3 (Interior Right)</small>
                <p style="font-size:11px;">${txt3}</p>
                ${renderImg(img3)}
              </div>
            </div>
          `;
        } else {
          lienzo.innerHTML = `
            <div class="grid-triptico">
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">SOLAPA (Cara 4)</small>
                <p style="font-size:11px;">${txt1}</p>
              </div>
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">CONTRAPORTADA (Cara 5)</small>
                <p style="font-size:11px; text-align:center;"><strong>Datos Escolares:</strong><br>${alumno}<br>${escuela}</p>
              </div>
              <div class="col-triptico">
                <small style="background:#e2e8f0; padding:2px 4px; border-radius:4px;">PORTADA (Cara 6)</small>
                <h3 style="text-align:center; color:#ff4757;">${titulo}</h3>
                ${renderImg(img1)}
              </div>
            </div>
          `;
        }
      } else {
        // LÁMINA EXPOSITIVA
        lienzo.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:10px; height:100%;">
            <div style="background:#ff7675; color:white; padding:10px; border-radius:12px; text-align:center; font-family:var(--font-title); font-size:22px;">🌟 ${titulo} 🌟</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <div style="background:#fff; border:2px solid #74b9ff; padding:10px; border-radius:12px;"><p style="font-size:11px;">${txt1}</p>${renderImg(img1)}</div>
              <div style="background:#fff; border:2px solid #74b9ff; padding:10px; border-radius:12px;"><p style="font-size:11px;">${txt2}</p>${renderImg(img2)}</div>
            </div>
            <div style="background:#fff; border:2px solid #eccc68; padding:10px; border-radius:12px;"><p style="font-size:11px;">${txt3}</p>${renderImg(img3)}</div>
            <div style="text-align:center; font-size:10px; color:#b2bec3;">${alumno} | ${escuela}</div>
          </div>
        `;
      }
    }

    function exportarPNG() {
      const lienzo = document.getElementById('hojaLienzo');
      html2canvas(lienzo, { scale: 2 }).then(canvas => {
        const enlace = document.createElement('a');
        enlace.download = 'recurso-pinpunpan.png';
        enlace.href = canvas.toDataURL('image/png');
        enlace.click();
      });
    }

    // Cargar datos guardados al iniciar
    cargarMemoria();
  </script>

</body>
</html>
